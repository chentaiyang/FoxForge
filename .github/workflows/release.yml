# 在 Windows 上打包 NSIS 安装包，并发布到 GitHub Releases。
# 推送 v 开头的标签（例如 v0.1.1）即会触发；也可在 Actions 里手动运行。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v0.1.1；留空则仅构建不发版'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure resource directories
        shell: bash
        run: mkdir -p resources/bin resources/LibreOffice resources/calibre resources/vocal-python resources/tessdata resources/uvr-models .cache/windows-engines

      - name: Cache Windows engine archives
        uses: actions/cache@v4
        with:
          path: .cache/windows-engines
          key: win-engines-v2-${{ hashFiles('scripts/ensure-windows-engines.mjs') }}
          restore-keys: |
            win-engines-v2-
            win-engines-v1-

      - name: Bundle conversion engines
        shell: bash
        env:
          FOXFORGE_ENGINE_CACHE: ${{ github.workspace }}/.cache/windows-engines
        run: node scripts/ensure-windows-engines.mjs --install

      - name: Save engine download cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/windows-engines
          key: win-engines-v2-${{ hashFiles('scripts/ensure-windows-engines.mjs') }}-${{ github.run_id }}

      - name: Build Windows NSIS installer
        env:
          # 当前没有代码签名证书，跳过自动发现，避免打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: 灵狐工坊 ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: false
          body_path: release-notes/${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}.md
          files: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
