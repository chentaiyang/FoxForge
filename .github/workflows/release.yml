# 在 Windows 上打包 NSIS 安装包，并发布到 GitHub Releases。
# 推送 v 开头的标签（例如 v0.1.0）即会触发；也可在 Actions 里手动运行。
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本标签，例如 v0.1.0；留空则仅构建不发版'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure optional resource directories
        shell: bash
        run: mkdir -p resources/uvr-models

      - name: Build Windows NSIS installer
        env:
          # 当前没有代码签名证书，跳过自动发现，避免打包失败
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: 灵狐工坊 ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          generate_release_notes: true
          files: |
            release/*-Setup.exe
            release/*-Setup.exe.blockmap
            release/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
